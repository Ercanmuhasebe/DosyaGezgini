name: Windows release and update feed

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Build and publish this version (for example 1.0.1)'
        required: true
        default: '1.0.1'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Build application and updater
        id: build
        shell: pwsh
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $version = $env:APP_VERSION
          } else {
            if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+(\.\d+)?$') {
              throw "Etiket v1.2.3 biçiminde olmalı: $env:GITHUB_REF_NAME"
            }
            $version = $env:GITHUB_REF_NAME.Substring(1)
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') {
            throw "Sürüm 1.2.3 biçiminde olmalı: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          ./build.ps1 -Version $version -Repository $env:GITHUB_REPOSITORY

      - name: Publish release files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.build.outputs.version }}
        run: |
          $tag = "v$env:APP_VERSION"
          $assets = @(
            "dist/DosyaGezgini.exe",
            "dist/DosyaGezgini-Updater.exe",
            "dist/DosyaGezgini-IlkKurulum.zip"
          )
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw "Sürüm dosyaları yüklenemedi: $tag" }
            gh release edit $tag --title "Dosya Gezgini $env:APP_VERSION" --latest
          } else {
            gh release create $tag @assets --title "Dosya Gezgini $env:APP_VERSION" --generate-notes
          }

      - name: Prepare update page
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  publish-update-page:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish update manifest and page
        id: deployment
        uses: actions/deploy-pages@v4
