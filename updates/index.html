<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dosya Gezgini | Güncellemeler</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", Arial, sans-serif; color: #17243a; background: #f3f6fb; }
    body { margin: 0; }
    header { padding: 48px 24px; color: white; background: linear-gradient(125deg, #174a7e, #178b83); }
    main { max-width: 800px; margin: 28px auto; padding: 0 20px; }
    .card { background: white; border: 1px solid #dce4ee; border-radius: 14px; padding: 24px; margin: 18px 0; }
    h1 { margin: 0 0 10px; font-size: 32px; } h2 { margin-top: 0; }
    p { line-height: 1.65; } a { color: #126a82; }
    .button { display: inline-block; margin-top: 8px; padding: 11px 18px; border-radius: 8px; color: white; background: #176f86; text-decoration: none; font-weight: 600; }
    code { overflow-wrap: anywhere; }
    footer { text-align: center; color: #627188; padding: 20px; font-size: 13px; }
  </style>
</head>
<body>
  <header><h1>Dosya Gezgini</h1><div>Güncel sürüm: CURRENT_VERSION</div></header>
  <main>
    <section class="card">
      <h2>Otomatik güncelleme</h2>
      <p>Program açılışta yeni sürümü denetler. Yeni sürüm onaylandığında dosya indirilir, SHA-256 özetiyle doğrulanır ve güncelleme yardımcısıyla kurulur.</p>
      <a class="button" href="https://github.com/OWNER/REPOSITORY/releases/latest">Son sürümü indir</a>
    </section>
  </main>
  <footer>Dosya Gezgini güncelleme sayfası</footer>
</body>
</html>
